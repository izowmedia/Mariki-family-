<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<title>Events — Mariki Family Portal</title></head>
<body><div class="loader-screen"><div class="loader-ring"></div><div class="loader-brand">Mariki</div></div>
<div class="app"><div id="shell-sidebar"></div><div class="main"><div id="shell-topbar"></div><div class="content">
<div class="page-head"><div><h1>Family Events</h1><div class="sub">Plan, RSVP, remember.</div></div>
<button class="btn btn-gold" id="newBtn" data-role-only="admin,superadmin"><i class="fa-solid fa-plus"></i> New event</button></div>
<div class="grid cols-2" id="evList"><div class="skeleton" style="height:140px"></div><div class="skeleton" style="height:140px"></div></div>

<div class="modal" id="evModal"><div class="modal-card">
<h3>Create event</h3>
<form id="evForm">
<div class="field"><label>Title</label><input name="title" required></div>
<div class="field"><label>Description</label><textarea name="description" rows="2"></textarea></div>
<div class="row"><div class="field"><label>Date</label><input type="datetime-local" name="date" required></div>
<div class="field"><label>Location</label><input name="location" required></div></div>
<div class="field"><label>Type</label><select name="type"><option>family</option><option>wedding</option><option>funeral</option><option>meeting</option><option>graduation</option></select></div>
<div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="document.getElementById(`evModal`).classList.remove(`open`)">Cancel</button><button class="btn btn-gold" type="submit">Create</button></div>
</form></div></div></div></div></div>
<script type="module">
import { mountShell } from './assets/js/sidebar.js';
import { guardPage } from './assets/js/auth-guard.js';

import { db } from "./firebase.js";
import { collection, getDocs, addDoc, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { fmtDate, toast } from "./assets/js/common.js";
let USER;
function countdown(target){
  const diff = target.getTime() - Date.now();
  if(diff<0) return `<span class="badge danger">Past</span>`;
  const d=Math.floor(diff/86400000), h=Math.floor(diff%86400000/3600000), m=Math.floor(diff%3600000/60000);
  return `<div class="countdown"><div>${d}d</div><div>${h}h</div><div>${m}m</div></div>`;
}
async function load(){
  const list=document.getElementById("evList");
  const snap = await getDocs(collection(db,"events"));
  if(snap.empty){ list.innerHTML=`<div class="card" style="grid-column:1/-1;text-align:center;color:#888;padding:40px">No events yet.</div>`; return; }
  list.innerHTML = snap.docs.map(d=>{ const e={id:d.id,...d.data()}; const dt=e.date?(e.date.toDate?e.date.toDate():new Date(e.date)):null;
    const rsvped = (e.rsvps||[]).includes(USER.uid);
    return `<div class="event-card"><div class="date"><div class="d">${dt?dt.getDate():"-"}</div><div class="m">${dt?dt.toLocaleString("en",{month:"short"}):""}</div></div>
    <div style="flex:1"><h4>${e.title}</h4><div class="meta"><i class="fa-solid fa-location-dot"></i> ${e.location||"-"} &middot; ${fmtDate(e.date)}</div><p style="color:#bdbdbd;font-size:13px">${e.description||""}</p>
    ${dt?countdown(dt):""}
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ${rsvped?"btn-ghost":"btn-gold"} btn-sm" data-rsvp="${e.id}">${rsvped?"<i class=\"fa-solid fa-check\"></i> RSVPed":"RSVP"}</button>
      <span class="badge gold">${(e.rsvps||[]).length} attending</span>
      ${USER.role==="admin"||USER.role==="superadmin"?`<button class="btn btn-danger btn-sm" data-del="${e.id}"><i class="fa-solid fa-trash"></i></button>`:""}
    </div></div></div>`;
  }).join("");
  list.querySelectorAll("[data-rsvp]").forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.rsvp; const ref=doc(db,"events",id);
    const snap2=await getDocs(collection(db,"events")); const ev=snap2.docs.find(d=>d.id===id).data();
    const rsvps=ev.rsvps||[]; const has=rsvps.includes(USER.uid);
    const newR = has?rsvps.filter(x=>x!==USER.uid):[...rsvps,USER.uid];
    await updateDoc(ref,{rsvps:newR}); load();
  });
  list.querySelectorAll("[data-del]").forEach(b=>b.onclick=async ()=>{ if(!confirm("Delete?")) return; await deleteDoc(doc(db,"events",b.dataset.del)); load(); });
}
window.initPage = async (u)=>{ USER=u; await load();
  if(["admin","superadmin"].includes(u.role)){
    document.getElementById("newBtn").onclick=()=>document.getElementById("evModal").classList.add("open");
    document.getElementById("evForm").addEventListener("submit", async e=>{
      e.preventDefault(); const f=Object.fromEntries(new FormData(e.target).entries());
      await addDoc(collection(db,"events"),{ ...f, date:new Date(f.date), rsvps:[], createdBy:u.uid, createdAt:serverTimestamp() });
      await addDoc(collection(db,"notifications"),{type:"event_created",title:"New event",message:f.title,audience:"all",read:false,createdAt:serverTimestamp()});
      document.getElementById("evModal").classList.remove("open"); e.target.reset(); toast("Event created","success"); load();
    });
  }
};

(async ()=>{ const u = await guardPage({}); mountShell('events','Events'); if(typeof initPage==='function') initPage(u); })();
</script></body></html>
